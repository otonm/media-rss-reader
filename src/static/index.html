<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Media RSS">
  <meta name="description" content="Self-hosted media RSS reader with vertical scrolling and slideshow">
  <title>Media RSS Reader</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/style.css?v={{VERSION}}">
  <!-- CONFIG_VARS -->
  <!-- ^ must stay AFTER style.css. Both set the same custom properties on
       :root with identical specificity, so the later declaration wins. With
       this block first, style.css's defaults silently overrode every value
       injected from the environment. -->
</head>
<body>
  <div id="feed" aria-label="Media feed"></div>
  <div id="status-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-card">
      <button id="status-modal-close" class="modal-close" type="button" aria-label="Close">×</button>
      <div id="status-modal-body" class="modal-body"></div>
    </div>
  </div>
  <div id="controls">
    <button id="btn-fab" class="fab-only" type="button" aria-label="Menu" title="Menu">☰</button>
    <button id="btn-autoscroll" class="option" type="button" aria-pressed="false" aria-label="Toggle autoscroll" title="Autoscroll [a]">⟳</button>
    <button id="btn-mute" class="option" type="button" aria-pressed="true" aria-label="Toggle mute" title="Mute [m]">🔇</button>
    <button id="btn-show-seen" class="option" type="button" aria-pressed="false" aria-label="Toggle show seen" title="Show seen [s]">✓</button>
    <button id="btn-status" class="option" type="button" aria-label="Reddit Feeds status" title="Status">📊</button>
  </div>
  <script src="/static/item-store.js?v={{VERSION}}"></script>
  <script src="/static/cache-queue.js?v={{VERSION}}"></script>
  <script src="/static/feed-view.js?v={{VERSION}}"></script>
  <script src="/static/scroll-controller.js?v={{VERSION}}"></script>
  <script src="/static/autoscroll-controller.js?v={{VERSION}}"></script>
  <script src="/static/controls.js?v={{VERSION}}"></script>
  <script src="/static/app.js?v={{VERSION}}"></script>
</body>
</html>
