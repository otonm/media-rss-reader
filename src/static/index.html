<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Media RSS Reader</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <!-- CONFIG_VARS -->
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="feed" aria-label="Media feed"></div>
  <div id="controls">
    <button id="btn-fab" class="fab-only" type="button" aria-label="Menu" title="Menu">☰</button>
    <button id="btn-autoscroll" class="option" type="button" aria-pressed="false" aria-label="Toggle autoscroll" title="Autoscroll [a]">⟳</button>
    <button id="btn-mute" class="option" type="button" aria-pressed="true" aria-label="Toggle mute" title="Mute [m]">🔇</button>
    <button id="btn-show-seen" class="option" type="button" aria-pressed="false" aria-label="Toggle show seen" title="Show seen [s]">✓</button>
  </div>
  <script src="/static/item-store.js"></script>
  <script src="/static/cache-queue.js"></script>
  <script src="/static/feed-view.js"></script>
  <script src="/static/scroll-controller.js"></script>
  <script src="/static/autoscroll-controller.js"></script>
  <script src="/static/controls.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
