[project]
name = "media-rss-reader"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "feedparser",
    "aiosqlite",
    "itsdangerous",
    "pyotp",
    "python-multipart>=0.0.27",
    "pillow",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
]

[tool.ruff]
target-version = "py314"
line-length = 120
# Vendored third-party reference extensions — not ours to lint or format.
extend-exclude = ["deduplicators"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN", "ASYNC", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # Pytest assertions are test outcomes, not runtime security checks.

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing --cov-report=html:htmlcov --cov-fail-under=90"

[tool.coverage.run]
source = ["src"]
omit = ["src/static/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
