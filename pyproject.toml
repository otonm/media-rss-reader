[project]
name = "media-rss-reader"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "feedparser",
    "aiosqlite",
    "itsdangerous",
    "pyotp",
    "python-multipart>=0.0.27",
    "pillow",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
]

[tool.ruff]
# py313, not py314, despite requires-python >= 3.14: ruff 0.15.12's formatter
# rewrites `except (A, B):` into the Python 2 `except A, B:` under py314, which
# is a SyntaxError. CI runs `ruff format --check`, so the corruption is not just
# possible but enforced — it is how src/feeds/fetcher.py came to be unimportable
# on main. Nothing here uses py314-only syntax, so the only cost is that ruff
# will not suggest py314-only idioms. Restore py314 once the bug is fixed
# upstream (verify with: ruff format --diff --isolated --target-version py314
# on a file containing a multi-exception except clause).
target-version = "py313"
line-length = 120
# Vendored third-party reference extensions — not ours to lint or format.
extend-exclude = ["deduplicators"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN", "ASYNC", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # Pytest assertions are test outcomes, not runtime security checks.

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing --cov-report=html:htmlcov --cov-fail-under=90"

[tool.coverage.run]
source = ["src"]
omit = ["src/static/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
